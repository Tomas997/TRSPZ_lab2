spring:
  application:
    name: lab3

  datasource:
    url: ${DB_URL}
    username: ${USERNAME}
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT}